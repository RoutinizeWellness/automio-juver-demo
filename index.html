function tableJobs(list){return '<table class="table responsive"><thead><tr><th>Orden / proyecto</th><th>Fase actual</th><th>Material</th><th>Objetivo de salida</th><th>Avance de muestra</th><th></th></tr></thead><tbody>'+list.map(j=>'<tr><td data-label="Orden"><div><span class="record-id">'+j.id+'</span><strong>'+esc(j.name)+'</strong><small>'+j.project+'</small></div></td><td data-label="Fase">'+j.steps[j.phase]+'</td><td data-label="Material">'+(missing(j.id).length?badge(missing(j.id).length+(missing(j.id).length===1?' pendiente':' pendientes'),risk(j.id)?'cambio':'pendiente'):badge('Completo','recibido'))+'</td><td data-label="Objetivo">'+date(j.target)+'<small>Por validar</small></td><td data-label="Avance"><div>'+j.progress+' %<div class="progress"><i style="width:'+j.progress+'%"></i></div></div></td><td>'+btn('Ver orden','openJob(\''+j.id+'\')','small')+'</td></tr>').join('')+'</tbody></table>'}
function productionView(){let rows=jobs.filter(j=>(filter==='all'||filter==='material'&&missing(j.id).length||filter==='sat'&&j.kind==='Mantenimiento'||filter==='installation'&&j.id.startsWith('INS'))&&(!query||JSON.stringify(j).toLowerCase().includes(query)));return head('Producción','Fabricación propia, mantenimiento e instalaciones',btn('Plan de taller',"go('planning')",'primary'))+'<div class="filters">'+[['all','Todas · '+jobs.length],['material','Material pendiente'],['sat','Mantenimiento'],['installation','Instalaciones']].map(([id,t])=>'<button class="chip '+(filter===id?'on':'')+'" onclick="setFilter(\''+id+'\')">'+t+'</button>').join('')+'<span class="count">'+rows.length+' órdenes</span></div>'+panel('Órdenes abiertas','',rows.length?tableJobs(rows):'<div class="empty">No hay órdenes con ese filtro.</div>')}
function planningView(){const planned=planApproved?26:24;const centres=[['Montaje hidráulico',22,32],['Montaje eléctrico',14,24],['Servicio técnico',13,24]];return head('Plan de taller','23–27 de noviembre de 2026 · Plan de ejemplo',btn('Restablecer','setScenario(false)'))+'<div class="filters"><button class="chip '+(!delay?'on':'')+'" onclick="setScenario(false)">Escenario base</button><button class="chip '+(delay?'on':'')+'" onclick="setScenario(true)">Válvulas: entrega el 25</button></div>'+(delay?'<div class="notice"><b>PC-1048.</b> Las válvulas llegan el 25; el montaje estaba previsto el 24. Revisa el cambio antes de aplicarlo.</div>':'')+panel('Operaciones previstas','','<div class="week"><div class="day">Centro / trabajo</div>'+[23,24,25,26,27].map(n=>'<div class="day"><span>'+['Lun','Mar','Mié','Jue','Vie'][n-23]+'</span><b>'+n+'</b></div>').join('')+weekRow('Montaje hidráulico','OF-26041',planned,12,delay&&!planApproved?'redslot':planApproved?'':'warn',delay&&!planApproved?'Material posterior al inicio':'Equipo a medida')+weekRow('Montaje eléctrico','OF-26042',25,8,'','Equipo de laboratorio')+weekRow('Montaje eléctrico','OF-26044',24,6,'warn','Sensores sin confirmar')+weekRow('Servicio técnico','SAT-26018',24,4,'','Juntas recibidas')+weekRow('Servicio técnico','INS-26020',26,6,'warn','Kit pendiente de recepción')+'</div>')+(delay?panel('OF-26041 · Cambio de montaje','','<div class="panel-body"><div class="compare"><div><small>Plan base</small><strong>24 noviembre</strong><span class="quiet">Material previsto el 23</span></div><div><small>Propuesta</small><strong>26 noviembre</strong><span class="quiet">Si el material llega el 25</span></div></div><p class="sub">Pendiente: llegada del material, capacidad y pruebas. La salida del equipo sigue por validar.</p><div class="actions">'+btn(planApproved?'Cambio aprobado':'Aprobar cambio','approvePlan()','primary')+btn('Abrir orden afectada',"openJob('OF-26041')")+'</div>'+(planApproved?'<div class="local-status">Plan de ejemplo actualizado. No se ha modificado ninguna orden real.</div>':'')+'</div>'):'')+panel('Carga semanal · ejemplo','','<div class="panel-body">'+centres.map(([n,h,c])=>'<div class="capacity-row"><b>'+n+'</b><div class="progress"><i style="width:'+Math.round(h/c*100)+'%"></i></div><span>'+h+' / '+c+' h</span></div>').join('')+'<div class="quiet">Horas y disponibilidad ficticias. No es un cálculo de capacidad real.</div></div>')}
function weekRow(centre,id,day,h,cls,detail){return '<div class="plan-row"><div class="name"><b>'+centre+'</b><small class="sub">'+id+'</small></div>'+[23,24,25,26,27].map(n=>'<div class="plan-cell '+(n===day?'occupied':'vacant')+'">'+(n===day?'<button class="plan-slot '+cls+'" onclick="openJob(\''+id+'\')"><span class="slot-top"><b>'+id+'</b><span>'+h+' h</span></span><small class="slot-date">'+date(n)+'</small><small>'+detail+'</small></button>':'')+'</div>').join('')+'</div>'}
function mailView(){let choices=pos.filter(p=>['PC-1048','PC-1049','PC-1051'].includes(p.id));let p=choices[mailIndex]||choices[0];const texts={'PC-1048':'Buenos días,\nLa entrega de las 6 válvulas del pedido PC-1048 se desplaza del 23 al 25 de noviembre. Disculpad el cambio.\nQuedamos pendientes de vuestra confirmación.\nProveedor A · mensaje ficticio','PC-1049':'Buenos días,\nHemos recibido vuestro pedido PC-1049 para el cuadro eléctrico. Os confirmaremos la fecha de entrega cuando tengamos la previsión.\nProveedor B · mensaje ficticio','PC-1051':'Buenos días,\nSe han entregado 5 de las 8 piezas del pedido PC-1051. Las 3 restantes están previstas para el 24 de noviembre.\nProveedor D · mensaje ficticio'};return head('Proveedores','Correspondencia de ejemplo')+panel('Mensajes','','<div class="inbox"><div class="mail-list">'+choices.map((m,i)=>'<button class="mail-item '+(i===mailIndex?'on':'')+'" onclick="mailIndex='+i+';render()"><b>'+m.supplier+' <span class="badge grey" style="display:inline">Ejemplo</span></b><span>'+m.id+' · '+(i===0?'Cambio de entrega':i===1?'Pedido recibido':'Entrega parcial')+'</span><small>20 nov · '+(10-i)+':'+(i?'15':'42')+'</small></button>').join('')+'</div><div class="mail-reader"><h2>'+p.id+' · '+p.part+'</h2><div class="sub">De: '+p.supplier+' · Fuente simulada</div><div class="mail-content">'+esc(texts[p.id])+'</div><div class="notice neutral"><b>Vinculado a '+p.job+'</b><br>'+getJob(p.job).name+' · '+p.reason+'</div><div class="actions">'+btn('Revisar pedido y respuesta','openPO(\''+p.id+'\')','primary')+btn('Ver orden de fabricación','openJob(\''+p.job+'\')')+'</div></div></div>')}
function activityView(){return head('Actividad','Cambios de esta sesión. Se borran al recargar.')+panel('Historial de muestra',log.length+' entradas','<div class="panel-body"><ul class="timeline">'+log.map(l=>'<li><b>'+esc(l.text)+'</b><p>'+l.time+'</p></li>').join('')+'</ul></div>',btn('Reiniciar toda la demo','confirmReset()','small'))}
function alcance(){return head('Una demo pensada para contrastar','Lo que sabemos por la web y lo que hay que validar en persona.')+'<div class="two-col">'+panel('Maquinaria textil a medida','Base de personalización','<div class="panel-body readme"><p>Juver describe en su web la fabricación de maquinaria para tintura textil, equipos de laboratorio, calderería y mantenimiento industrial. Por eso los ejemplos relacionan componentes comprados con montaje, instrumentación y reparación, no lotes de una fábrica de tejidos.</p><p>Los proyectos A–G, proveedores A–I, piezas, rutas, importes y horas son ficticios. No son listas de materiales ni instrucciones técnicas de Juver.</p><p><a href="https://www.juversl.com/empresa/" target="_blank" rel="noopener">Actividad oficial de Juver</a><br><a href="https://www.juversl.com/maquinaria/" target="_blank" rel="noopener">Gama de maquinaria</a></p><p class="quiet">Consultado el 20 de noviembre de 2026.</p></div>')+panel('Para la visita','Un caso real, no más pantallas','<div class="panel-body readme"><h3>Compras</h3><p>¿Cómo se registra una confirmación o un cambio de entrega? ¿Dónde queda la conversación con el proveedor?</p><h3>Producción</h3><p>¿Qué material condiciona cada orden? ¿Quién decide el cambio del plan y con qué información?</p><h3>Sistemas</h3><p>Qué herramientas usáis, qué se puede leer o escribir y qué debe aprobar una persona. No suponemos ningún ERP concreto.</p></div>')+'</div>'+panel('Por qué estos casos de trabajo','Hechos públicos separados de hipótesis','<div class="panel-body readme"><h3>1. Fabricación a medida → configuración por orden</h3><p>La web oficial indica capacidades, accesorios y extras según cada cliente. La demo vincula proyecto, revisión, componentes y fases. Hipótesis a validar: cómo se gestiona hoy una modificación y qué aprobación necesita.</p><h3>2. Recambios + SAT → material y agenda juntos</h3><p>Su catálogo incluye juntas, válvulas, bombas y sondas, y ofrece mantenimiento de maquinaria propia y externa. La demo incluye reparaciones con compra vinculada y recepción parcial. No presupone averías recurrentes ni retrasos reales.</p><h3>3. Representación de marcas → instalación separada</h3><p>La web presenta marcas representadas y una publicación pública describe una instalación MCS realizada por Juver. La orden INS-26020 muestra preparación, instalación, puesta en marcha y entrega documental. Es un caso ficticio, no la instalación publicada.</p><h3>4. Equipos e instalaciones → revisión documental humana</h3><p>Su página de servicios incluye instalaciones y equipos a presión. La demo añade una revisión documental de muestra, sin automatizar certificaciones, seguridad ni liberación técnica.</p><p><b>Hipótesis común:</b> relacionar una fecha de proveedor con una fase del taller puede ayudar a detectar dependencias antes de replanificar. No afirmamos que Juver tenga un problema concreto ni prometemos ahorros.</p><p><a href="https://www.juversl.com/recambios/" target="_blank" rel="noopener">Recambios oficiales</a> · <a href="https://www.juversl.com/servicios/" target="_blank" rel="noopener">Servicios oficiales</a> · <a href="https://www.mcstextile.it/contatti/agenti" target="_blank" rel="noopener">Directorio oficial MCS</a></p><p><a href="https://es.linkedin.com/posts/juan-carlos-vergara-gonzalez-a2bb63286_montaje-e-instalaci%C3%B3n-de-la-nueva-m%C3%A1quina-activity-7103034221799055360-Aw1c" target="_blank" rel="noopener">Publicación pública sobre una instalación · 31 agosto 2023</a></p><p class="quiet">La búsqueda de reseñas e entrevistas no aportó una base verificada para describir problemas internos. No se han deducido urgencias, sistemas usados ni tamaño de equipo a partir de directorios.</p></div>')+panel('Qué funciona en la demostración','Interacciones locales y reversibles','<div class="panel-body readme"><ul><li>Filtros y búsqueda de pedidos y órdenes; detalle de material y fases.</li><li>Comparar fecha original con propuesta, aceptar o rechazar localmente y mantener la fecha inicial como referencia.</li><li>Registrar una recepción parcial o completa, sin superar la cantidad pedida.</li><li>Editar y aprobar un borrador de respuesta, sin enviarlo.</li><li>Probar un retraso, comprobar la orden afectada y aprobar manualmente una nueva fecha de montaje.</li><li>Añadir un parte de avance ilustrativo y conservar la actividad de la sesión.</li></ul><p><b>No hace:</b> enviar correos, comprar, conectar con ERP, calcular capacidad real, certificar calidad o dar instrucciones a máquinas. Las aprobaciones no son compromisos comerciales. Recargar reinicia todo.</p></div>')+panel('Estructura de trabajo','Referencias funcionales, no integraciones','<div class="panel-body readme"><p>Cola de excepciones y comparación de cambios inspiradas en <a href="https://support.sourceday.com/hc/en-us/articles/6107159645972-Collaborate-with-suppliers-on-purchase-orders" target="_blank" rel="noopener">la revisión de propuestas de SourceDay</a>. Órdenes, dependencias y carga de centros toman como referencia <a href="https://www.odoo.com/app/manufacturing-features" target="_blank" rel="noopener">los flujos de fabricación de Odoo</a>.</p><p>Este prototipo no es producto de esas plataformas ni afirma compatibilidad con ellas. Su uso solo sirve para explicar el flujo propuesto.</p></div>')}
function setFilter(f){filter=f;render()}function setScenario(v){delay=v;planApproved=false;getJob('OF-26041').start=24;render()}function approvePlan(){if(planApproved)return toast('El cambio ya está aprobado en esta simulación.');planApproved=true;getJob('OF-26041').start=26;addLog('Plan simulado: montaje de OF-26041 movido al 26 de noviembre. Objetivo de salida pendiente de revisión.');render();toast('Cambio aplicado solo al plan de ejemplo.')}function render(){nav();let v={home,purchases:purchaseView,approvals:approvalsView,production:productionView,planning:planningView,mail:mailView,activity:activityView,alcance};document.getElementById('main').innerHTML=v[page]()+footer()}
function openDrawer(title,subtitle,body){previousFocus=document.activeElement;document.getElementById('modal').innerHTML='<div class="overlay" onclick="if(event.target===this)closeDrawer()"><section class="drawer" role="dialog" aria-modal="true" aria-label="'+esc(title)+'"><header class="drawer-head"><div><div class="eyebrow">'+subtitle+'</div><h2>'+title+'</h2><span class="quiet">Ejemplo de trabajo · Sin conexión a sistemas reales</span></div><button class="close" onclick="closeDrawer()" aria-label="Cerrar detalle">×</button></header><div class="drawer-body">'+body+'</div></section></div>';document.body.style.overflow='hidden';document.querySelector('.drawer .close').focus()}function closeDrawer(){document.getElementById('modal').innerHTML='';document.body.style.overflow='';if(previousFocus?.isConnected)previousFocus.focus();previousFocus=null}
function openPO(id){let p=getPO(id),j=getJob(p.job);openDrawer(p.id+' · '+p.part,'COMPRA','<div class="detail-grid"><div><span>Proveedor</span><strong>'+p.supplier+' · simulado</strong></div><div><span>Referencia</span><strong>'+p.ref+'</strong></div><div><span>Orden vinculada</span><strong>'+p.job+' · '+j.project+'</strong></div><div><span>Importe de muestra</span><strong>'+eur(p.cost)+' · no es una oferta</strong></div></div>'+badge(p.status,p.type)+'<div class="notice neutral" style="margin-top:16px">'+p.reason+'</div>'+(p.proposed?'<h3>Comparar la propuesta</h3><div class="compare"><div><small>Fecha original conservada</small><strong>'+date(basePO.find(x=>x.id===id).date)+'</strong></div><div><small>Propuesta del proveedor</small><strong>'+date(p.proposed)+'</strong></div></div><div class="actions">'+btn('Aceptar fecha','decidePO(\''+id+'\',true)','primary')+btn('Rechazar fecha','decidePO(\''+id+'\',false)')+'</div>':'')+'<section class="panel"><div class="panel-head"><h2>Impacto en producción</h2></div><div class="panel-body"><b>'+j.id+' · '+j.name+'</b><p class="sub">'+j.centre+' · Inicio previsto: '+date(j.start)+' · Objetivo de salida: '+date(j.target)+', por validar.</p>'+btn('Abrir orden vinculada','openJob(\''+j.id+'\')','small')+'</div></section><h3>Recepción de material</h3><p class="sub">Recibido: '+p.rec+' de '+p.qty+' '+p.unit+'. Una fecha aceptada no implica recepción.</p><label class="form-label" for="qty">Cantidad recibida en esta entrada</label><input id="qty" class="field" type="number" min="1" max="'+(p.qty-p.rec)+'" value="'+(p.qty-p.rec>0?p.qty-p.rec:0)+'" '+(p.rec===p.qty?'disabled':'')+'><div class="actions" style="margin:12px 0 22px">'+(p.rec<p.qty?btn('Registrar recepción','receivePO(\''+id+'\')','primary'):'<span class="badge green">Recepción completa</span>')+'</div><h3>Respuesta al proveedor</h3><label class="form-label" for="draft">Borrador editable</label><textarea id="draft" class="field textarea" oninput="document.getElementById(\'draft-state\').textContent=\'\'">'+esc(p.draft)+'</textarea><div class="actions" style="margin:10px 0">'+btn('Aprobar borrador','approveDraft(\''+id+'\')','primary')+'</div><div class="local-status" id="draft-state" role="status"></div><div class="audit">Solo se guarda en esta sesión. No se envía correo ni se escribe en sistemas reales.</div>')}
function decidePO(id,accept){let p=getPO(id);if(!p.proposed)return;approvals[id]=accept?'aceptada':'rechazada';if(accept){p.date=p.proposed;p.status='Cambio aceptado';p.type='confirmado';addLog(id+': fecha de muestra aceptada para '+date(p.date)+'. Fecha original conservada. Sin aviso al proveedor.')}else{p.status='Cambio rechazado';p.type='pendiente';addLog(id+': propuesta de fecha rechazada en demo. Falta acordar otra fecha con el proveedor.')}render();openPO(id);toast('Decisión guardada solo en la demo.')}
function receivePO(id){let p=getPO(id),qty=Number(document.getElementById('qty').value);if(!Number.isInteger(qty)||qty<1||qty>p.qty-p.rec)return toast('Introduce una cantidad entera entre 1 y '+(p.qty-p.rec)+'.');p.rec+=qty;p.status=p.rec===p.qty?'Recibido':'Recepción parcial';p.type=p.rec===p.qty?'recibido':'parcial';if(p.rec===p.qty)approvals[id]='recibido';addLog(id+': recepción simulada de '+qty+' '+p.unit+'. Acumulado '+p.rec+'/'+p.qty+'.');render();openPO(id);toast('Recepción simulada. No cambia stock real.')}
function approveDraft(id){let p=getPO(id),txt=document.getElementById('draft').value.trim();if(!txt)return toast('Escribe una respuesta antes de aprobar.');p.draft=txt;document.getElementById('draft-state').textContent='Borrador aprobado localmente. No se ha enviado ningún correo.';addLog(id+': borrador revisado y aprobado en demo, sin envío.');toast('Aprobación registrada. Nada enviado.')}
function openJob(id){let j=getJob(id),components=pos.filter(p=>p.job===id);openDrawer(j.id+' · '+j.name,'ORDEN DE TRABAJO','<div class="detail-grid"><div><span>Proyecto</span><strong>'+j.project+' · '+j.kind+'</strong></div><div><span>Revisión</span><strong>'+j.rev+' · de muestra</strong></div><div><span>Centro de trabajo</span><strong>'+j.centre+'</strong></div><div><span>Objetivo de salida</span><strong>'+date(j.target)+' · por validar</strong></div></div><h3>Ruta de trabajo ilustrativa</h3><div class="flow">'+j.steps.map((s,i)=>'<span class="step '+(i<j.phase?'done':i===j.phase?'current':'')+'">'+(i+1)+'. '+s+'</span>').join('')+'</div><div class="mini-grid"><div><span>Avance registrado de muestra</span><b>'+j.progress+' %</b><div class="progress"><i style="width:'+j.progress+'%"></i></div></div><div><span>Carga pendiente ilustrativa</span><b>'+j.hours+' h</b></div></div><p class="secondary-note">Ruta y horas de ejemplo. Sin liberación técnica de fases.</p><h3>Material vinculado</h3><div class="panel">'+components.map(p=>'<div class="list-item"><div class="body"><b>'+p.part+'</b><p>'+p.id+' · '+p.rec+'/'+p.qty+' '+p.unit+' recibidas</p>'+badge(p.status,p.type)+'</div>'+btn('Ver pedido','openPO(\''+p.id+'\')','small')+'</div>').join('')+'</div><h3>Registrar parte de muestra</h3><div class="detail-grid"><div><label class="form-label" for="hours">Horas del parte</label><input id="hours" class="field" type="number" min="0.25" max="24" step="0.25" value="2"></div><div><label class="form-label" for="progress">Avance acumulado (%)</label><input id="progress" class="field" type="number" min="'+j.progress+'" max="100" value="'+Math.min(100,j.progress+5)+'"></div></div><label class="form-label" for="part-note">Nota del trabajo realizado</label><textarea id="part-note" class="field" rows="3" placeholder="Describe una tarea de ejemplo, sin datos reales"></textarea><div class="actions" style="margin:12px 0 24px">'+btn('Guardar parte','addPart(\''+id+'\')','primary')+'</div><h3>Documentación de muestra</h3><ul class="quiet">'+j.docs.map(d=>'<li>'+d+'</li>').join('')+'</ul><p class="secondary-note">Revisión técnica y documentación a validar por personal competente.</p><label style="display:flex;gap:9px;align-items:flex-start;font-size:11px;margin:15px 0"><input type="checkbox" id="doc-check" data-job="'+id+'" onchange="reviewDocs(this.dataset.job)" '+(docsChecked[id]?'checked':'')+'> Revisión documental de muestra. No certifica ni autoriza la puesta en marcha.</label><div class="audit">No hay planos ni certificados reales en esta demostración.</div>')}
function reviewDocs(id){docsChecked[id]=document.getElementById('doc-check').checked;addLog(id+': revisión documental de muestra '+(docsChecked[id]?'marcada':'retirada')+'. Sin certificación técnica.');toast('Revisión registrada solo en la demo.')}
function addPart(id){let h=Number(document.getElementById('hours').value),pr=Number(document.getElementById('progress').value),note=document.getElementById('part-note').value.trim(),j=getJob(id);if(!Number.isFinite(h)||h<=0||h>24||!Number.isInteger(pr)||pr<j.progress||pr>100||!note)return toast('Completa la nota, horas entre 0,25 y 24 y un avance acumulado válido.');j.progress=pr;addLog(id+': parte de muestra de '+h+' h, avance acumulado '+pr+' %. '+note);render();openJob(id);toast('Parte añadido solo al historial de demostración.')}
function confirmReset(){openDrawer('Restablecer demostración','SOLO ESTA SESIÓN','<p>Se perderán las recepciones, borradores editados, partes y decisiones de esta sesión. No afecta a ningún sistema real.</p><div class="actions">'+btn('Sí, restablecer la demo','resetDemo()','primary')+btn('Conservar cambios','closeDrawer()')+'</div>')}
function resetDemo(){pos=structuredClone(basePO);jobs=structuredClone(baseJobs);approvals={};docsChecked={};delay=false;planApproved=false;log=[{time:'20 nov · 10:42',text:'Proveedor A propone el 25 para PC-1048. Pendiente de revisión.'},{time:'20 nov · 09:35',text:'Recepción parcial de PC-1051: 5 de 8 piezas.'},{time:'20 nov · 09:10',text:'Recibidos los 2 kits de PC-1050.'}];closeDrawer();render();toast('Demostración restablecida.')}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeDrawer();if(e.key==='Tab'&&document.querySelector('.drawer')){const els=[...document.querySelectorAll('.drawer button,.drawer input,.drawer textarea,.drawer a')].filter(x=>!x.disabled);if(e.shiftKey&&document.activeElement===els[0]){e.preventDefault();els.at(-1).focus()}else if(!e.shiftKey&&document.activeElement===els.at(-1)){e.preventDefault();els[0].focus()}}});window.addEventListener('hashchange',()=>{let p=location.hash.slice(1);if(tabs.some(t=>t[0]===p)&&page!==p){page=p;filter='all';render();closeDrawer()}});let initial=location.hash.slice(1);if(tabs.some(t=>t[0]===initial))page=initial;render();
</script></body></html>
